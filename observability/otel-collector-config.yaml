receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889

  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:

    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - debug
        - otlp/tempo

    metrics:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - prometheus

    logs:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - debug
        - otlphttp/loki